services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wine}
      POSTGRES_DB: ${POSTGRES_DB:-wine_cellar}
    ports:
      # Loopback only: the default credentials are public in this repo.
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ keeps data in a versioned subfolder, so the volume mounts the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
